spring:
  application:
    name: vetline-crm
  datasource:
    url: jdbc:postgresql://localhost:5432/vetline_crm?stringtype=unspecified
    username: vetline
    password: vetline_secret_2025
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
    encoding: UTF-8
  mvc:
    hiddenmethod:
      filter:
        enabled: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

vk:
  group:
    # Access-токен сообщества с правами messages, manage
    token: ${VK_GROUP_TOKEN:REPLACE_ME}
    # Числовой идентификатор сообщества (без минуса)
    id: ${VK_GROUP_ID:0}
    # Версия VK API
    api-version: ${VK_API_VERSION:5.199}

webhook:
  secret-token: ${WEBHOOK_SECRET_TOKEN:webhook_secret_2025}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  vk-retry-attempts: 3

logging:
  level:
    ru.vetline: INFO
    org.springframework.security: WARN
  file:
    name: logs/vetline-crm.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
