# Профиль для локального запуска без Docker и без переменных окружения
# Используйте: mvn spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vetline_crm
    username: vetline
    password: vetline_secret_2025

vk:
  group:
    token: REPLACE_ME           # access-токен сообщества VK; пока REPLACE_ME — бот не запускается
    id: 0                       # числовой ID сообщества (например, 230456789)
    api-version: 5.199

webhook:
  secret-token: local_dev_secret

app:
  base-url: http://localhost:8080

logging:
  level:
    ru.vetline: DEBUG
    org.springframework.security: INFO
