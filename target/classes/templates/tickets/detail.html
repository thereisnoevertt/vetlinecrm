<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title th:text="'Заявка ' + ${ticket.number} + ' — Ветлайн ВК'">Заявка</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments :: navbar('all')}"></div>

<div class="container">
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

  <div class="page-header">
    <div>
      <a th:href="@{/tickets}" class="back-link">← Все заявки</a>
      <h1>Заявка <span th:text="${ticket.number}"></span></h1>
    </div>
    <div class="header-actions" sec:authorize="hasRole('MANAGER')"
         th:if="${!ticket.archived}">
      <!-- Смена статуса (Ф-05) -->
      <form th:action="@{/tickets/{id}/status(id=${ticket.id})}"
            method="post" class="inline-form"
            th:if="${!allowedTransitions.isEmpty()}">
        <select name="newStatus" class="input input-sm">
          <option value="" disabled selected>Изменить статус...</option>
          <option th:each="s : ${allowedTransitions}"
                  th:value="${s.name()}"
                  th:text="${s.displayName}"></option>
        </select>
        <button class="btn btn-primary btn-sm">Применить</button>
      </form>
      <!-- Уведомить клиента (Ф-06) -->
      <form th:action="@{/tickets/{id}/notify(id=${ticket.id})}" method="post">
        <button class="btn btn-secondary btn-sm"
                th:disabled="${!canNotify}"
                th:title="${!canNotify} ? 'Заполните VK ID клиента' : 'Отправить уведомление через VK'">
          📩 Уведомить
        </button>
      </form>
      <!-- Сформировать заказ поставщику (Прецедент №4) -->
      <a th:href="@{/supplier-orders/new(ticketId=${ticket.id})}"
         class="btn btn-outline btn-sm"
         title="Создать заказ поставщику на основании этой заявки">
        📦 Заказ поставщику
      </a>
    </div>
  </div>

  <div class="detail-grid">
    <!-- ═══ ЛЕВАЯ КОЛОНКА ═══════════════════════════════════════════════════ -->
    <div>
      <!-- Реквизиты заявки -->
      <div class="card">
        <div class="card-header">
          <h3>Реквизиты заявки</h3>
          <span class="badge" th:classappend="${ticket.status.badgeClass}"
                th:text="${ticket.status.displayName}"></span>
        </div>
        <div class="card-body field-grid-2">
          <div class="field"><label>№ заявки</label>
            <span th:text="${ticket.number}"></span></div>
          <div class="field"><label>Дата создания</label>
            <span th:text="${#temporals.format(ticket.createdAt,'dd.MM.yyyy HH:mm')}"></span></div>
          <div class="field"><label>Источник</label>
            <span th:text="${ticket.source != null ? ticket.source.name : '—'}"></span></div>
          <div class="field"><label>Категория</label>
            <span th:text="${ticket.category != null ? ticket.category.name : '—'}"></span></div>
          <div class="field"><label>Ответственный менеджер</label>
            <span th:text="${ticket.manager.fullName}"></span></div>
          <div class="field"><label>Последнее обновление</label>
            <span th:text="${#temporals.format(ticket.updatedAt,'dd.MM.yyyy HH:mm')}"></span></div>
        </div>
      </div>

      <!-- Клиент -->
      <div class="card">
        <div class="card-header"><h3>Клиент</h3></div>
        <div class="card-body field-grid-2">
          <div class="field"><label>ФИО</label>
            <span th:text="${ticket.client.fullName}"></span></div>
          <div class="field"><label>Телефон</label>
            <span th:text="${ticket.client.phone}"></span></div>
          <div class="field"><label>E-mail</label>
            <span th:text="${ticket.client.email ?: '—'}"></span></div>
          <div class="field"><label>Организация</label>
            <span th:text="${ticket.client.organization ?: '—'}"></span></div>
          <div class="field">
            <label>VK ID
              <span th:if="${!canNotify}" class="warn-icon"
                    title="Заполните для отправки уведомлений">⚠</span>
            </label>
            <span th:text="${ticket.client.vkId ?: 'Не указан'}"></span>
          </div>
        </div>
        <!-- Форма обновления VK ID (Ф-06) -->
        <div class="card-body" sec:authorize="hasRole('MANAGER')"
             th:if="${!ticket.archived}">
          <form th:action="@{/tickets/{id}/client/vk(id=${ticket.id})}"
                method="post" class="inline-form">
            <input type="number" name="vkId" class="input input-sm"
                   placeholder="VK ID клиента"
                   th:value="${ticket.client.vkId}" style="width:180px"/>
            <button class="btn btn-outline btn-sm">Сохранить VK ID</button>
          </form>
        </div>
      </div>

      <!-- Содержание -->
      <div class="card">
        <div class="card-header"><h3>Содержание</h3></div>
        <div class="card-body">
          <div class="field"><label>Описание потребности</label>
            <p class="field-text" th:text="${ticket.description ?: '—'}"></p></div>
          <div class="field"><label>Примечание клиента</label>
            <p class="field-text" th:text="${ticket.noteClient ?: '—'}"></p></div>
          <div class="field"><label>Итоговый комментарий менеджера</label>
            <p class="field-text" th:text="${ticket.noteManager ?: '—'}"></p></div>
        </div>
      </div>

      <!-- Архивация (Ф-07) -->
      <div class="card" th:if="${canArchive}" sec:authorize="hasRole('MANAGER')">
        <div class="card-header"><h3>Закрыть заявку</h3></div>
        <div class="card-body">
          <form th:action="@{/tickets/{id}/archive(id=${ticket.id})}" method="post">
            <div class="field">
              <label>Финальный комментарий</label>
              <textarea name="comment" class="input" rows="3"
                        placeholder="Кратко опишите результат..."></textarea>
            </div>
            <button class="btn btn-danger"
                    onclick="return confirm('Архивировать заявку? Действие необратимо.')">
              Закрыть и архивировать
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ═══ ПРАВАЯ КОЛОНКА: ИСТОРИЯ ═════════════════════════════════════════ -->
    <div class="detail-aside">
      <div class="card" style="height:100%">
        <div class="card-header"><h3>История изменений</h3></div>
        <div class="history-scroll">
          <div th:if="${ticket.history.isEmpty()}" class="empty-row">История пуста</div>
          <div th:each="h : ${ticket.history}" class="history-item">
            <div class="history-meta">
              <span class="history-date"
                    th:text="${#temporals.format(h.createdAt,'dd.MM HH:mm')}"></span>
              <span class="history-who"
                    th:text="${h.user != null ? h.user.fullName : 'Система'}"></span>
            </div>
            <div class="history-desc" th:text="${h.description}"></div>
            <div th:if="${h.statusFrom != null and h.statusTo != null}"
                 class="history-transition">
              <span class="badge badge-xs" th:classappend="${h.statusFrom.badgeClass}"
                    th:text="${h.statusFrom.displayName}"></span>
              <span>→</span>
              <span class="badge badge-xs" th:classappend="${h.statusTo.badgeClass}"
                    th:text="${h.statusTo.displayName}"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
