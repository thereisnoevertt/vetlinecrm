<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Вход — Ветлайн ВК</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <span class="login-logo">🐾</span>
      <h1>Ветлайн ВК</h1>
      <p class="text-muted">Взаимодействие с клиентами</p>
    </div>
    <div th:if="${errorMsg}"   class="alert alert-error"   th:text="${errorMsg}"></div>
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <form th:action="@{/login}" method="post" class="login-form">
      <div class="field">
        <label for="username">E-mail <span class="req">*</span></label>
        <input type="email" id="username" name="username" class="input"
               placeholder="manager@vetline.ru" autocomplete="email" required autofocus/>
      </div>
      <div class="field">
        <label for="password">Пароль <span class="req">*</span></label>
        <input type="password" id="password" name="password" class="input"
               placeholder="••••••••" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Войти в систему</button>
    </form>
    <p class="login-footer text-muted">
      При проблемах со входом обратитесь к системному администратору
    </p>
  </div>
</div>
</body>
</html>
