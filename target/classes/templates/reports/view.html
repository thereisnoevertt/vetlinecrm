<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${report.title} + ' — Ветлайн ВК'">Отчёт — Ветлайн ВК</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div th:replace="~{fragments :: navbar('reports')}"></div>

<div class="container">
  <div class="page-header">
    <h1 th:text="${report.title}">Отчёт</h1>
    <div>
      <a class="btn btn-outline btn-sm" th:href="@{/reports}">← К списку отчётов</a>
      <a class="btn btn-primary btn-sm"
         th:href="@{|/reports/export/${type}|(from=${from},to=${to},managerId=${managerId},format='xlsx')}">
        ⬇ xlsx
      </a>
      <a class="btn btn-secondary btn-sm"
         th:href="@{|/reports/export/${type}|(from=${from},to=${to},managerId=${managerId},format='pdf')}">
        ⬇ pdf
      </a>
    </div>
  </div>

  <div th:if="${!report.rows.isEmpty()}" class="report-grid">
    <div class="card">
      <div class="card-header"><h3>Табличное представление</h3></div>
      <div class="card-body">
        <table class="table">
          <thead>
          <tr>
            <th th:each="h : ${report.headers}" th:text="${h}">Колонка</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="row : ${report.rows}">
            <td th:each="cell : ${row}" th:text="${cell}">—</td>
          </tr>
          </tbody>
          <tfoot th:if="${report.totalLabel != null}">
          <tr>
            <th th:text="${report.totalLabel}" th:colspan="${report.headers.size() - 1}">Итого</th>
            <th th:text="${report.totalValue}">0</th>
          </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Визуализация</h3></div>
      <div class="card-body chart-wrap">
        <canvas id="reportChart"></canvas>
      </div>
    </div>
  </div>

  <div th:if="${report.rows.isEmpty()}" class="card">
    <div class="card-body text-muted">За указанный период данных нет.</div>
  </div>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  const reportType = /*[[${type}]]*/ '';
  const headers    = /*[[${report.headers}]]*/ [];
  const rows       = /*[[${report.rows}]]*/ [];
  /*]]>*/

  if (rows && rows.length) {
    const labels = rows.map(r => r[0]);
    const values = rows.map(r => parseFloat(String(r[1]).replace(',', '.')) || 0);
    const colors = ['#3b82f6','#f59e0b','#10b981','#6366f1','#ec4899',
                    '#14b8a6','#f97316','#8b5cf6','#22c55e','#ef4444','#94a3b8'];
    let chartType, dataset;
    if (reportType === 'sources' || reportType === 'categories') {
      chartType = 'doughnut';
      dataset = { data: values, backgroundColor: colors };
    } else if (reportType === 'conversion') {
      chartType = 'bar';
      dataset = { label: 'Значение', data: values, backgroundColor: colors };
    } else {
      chartType = 'bar';
      dataset = { label: headers[1] || 'Количество', data: values, backgroundColor: colors };
    }

    new Chart(document.getElementById('reportChart'), {
      type: chartType,
      data: { labels: labels, datasets: [dataset] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: chartType === 'doughnut' ? 'right' : 'top',
                    display: chartType === 'doughnut',
                    labels: { boxWidth: 12, font: { size: 11 } } }
        },
        scales: chartType === 'doughnut' ? {} :
                { y: { beginAtZero: true, ticks: { precision: 0, font: { size: 11 } } },
                  x: { ticks: { font: { size: 11 } } } }
      }
    });
  }
</script>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
