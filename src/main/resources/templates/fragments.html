<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="ru">
<body>

<!-- ═══════════════════ NAVBAR FRAGMENT ═══════════════════════════════════ -->
<nav th:fragment="navbar(section)" class="navbar">
  <div class="navbar-brand">
    <a th:href="@{/tickets}">🐾 <strong>Ветлайн ВК</strong></a>
  </div>
  <div class="navbar-menu">
    <a th:href="@{/tickets}"
       th:class="${section=='all' or section=='my'} ? 'nav-link active' : 'nav-link'">
      Заявки</a>
    <a th:href="@{/supplier-orders}"
       th:class="${section=='supplier-orders'} ? 'nav-link active' : 'nav-link'">
      Заказы поставщикам</a>
    <a th:href="@{/reports}" th:class="${section=='reports'} ? 'nav-link active' : 'nav-link'">
      Отчёты</a>
    <a th:href="@{/dashboard}"
       th:class="${section=='dashboard'} ? 'nav-link active' : 'nav-link'"
       sec:authorize="hasRole('DIRECTOR')">Дашборд</a>
    <a th:href="@{/tickets/archive}"
       th:class="${section=='archive'} ? 'nav-link active' : 'nav-link'">
      Архив</a>
    <a th:href="@{/admin/users}"
       th:class="${section=='admin'} ? 'nav-link active' : 'nav-link'"
       sec:authorize="hasRole('ADMIN')">Администрирование</a>
  </div>
  <div class="navbar-user">
    <span class="user-badge" sec:authentication="name">user</span>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button class="btn btn-sm btn-outline">Выйти</button>
    </form>
  </div>
</nav>

</body>
</html>
