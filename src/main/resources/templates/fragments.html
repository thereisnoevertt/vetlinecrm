<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="ru">
<body>

<!-- ═══════════════════ SIDEBAR ═════════════════════════════════════════ -->
<aside th:fragment="sidebar(section)" class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-logo">ВК</div>
    <div>
      <div class="sidebar-brand-name">Ветлайн</div>
      <div class="sidebar-brand-sub">Взаимодействие с клиентами</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-group">
      <div class="nav-group-title">Рабочая область</div>

      <a th:href="@{/tickets}"
         th:class="${section=='all' or section=='my'} ? 'nav-link active' : 'nav-link'">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="16" y2="17"/>
        </svg>
        Заявки
      </a>

      <a th:href="@{/clients}"
         th:class="${section=='clients'} ? 'nav-link active' : 'nav-link'">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Клиенты
      </a>

      <a th:href="@{/supplier-orders}"
         th:class="${section=='supplier-orders'} ? 'nav-link active' : 'nav-link'">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.5 9.4 7.55 4.24"/>
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        Заказы поставщикам
      </a>

      <a th:href="@{/tickets/archive}"
         th:class="${section=='archive'} ? 'nav-link active' : 'nav-link'">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="21 8 21 21 3 21 3 8"/>
          <rect x="1" y="3" width="22" height="5"/>
          <line x1="10" y1="12" x2="14" y2="12"/>
        </svg>
        Архив
      </a>
    </div>

    <div class="nav-group">
      <div class="nav-group-title">Аналитика</div>

      <a th:href="@{/reports}"
         th:class="${section=='reports'} ? 'nav-link active' : 'nav-link'">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="3" y1="20" x2="21" y2="20"/>
        </svg>
        Отчёты
      </a>

      <a th:href="@{/dashboard}"
         th:class="${section=='dashboard'} ? 'nav-link active' : 'nav-link'"
         sec:authorize="hasRole('DIRECTOR')">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3"  width="7" height="9"/>
          <rect x="14" y="3" width="7" height="5"/>
          <rect x="14" y="12" width="7" height="9"/>
          <rect x="3" y="16" width="7" height="5"/>
        </svg>
        Дашборд
      </a>
    </div>

    <div class="nav-group" sec:authorize="hasRole('ADMIN')">
      <div class="nav-group-title">Администрирование</div>

      <a th:href="@{/admin/users}"
         th:class="${section=='admin'} ? 'nav-link active' : 'nav-link'">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Пользователи
      </a>
    </div>
  </nav>

  <div class="sidebar-foot">
    <div class="user-pill">
      <div class="user-avatar"
           th:text="${#authentication.name != null ? #authentication.name.substring(0,1).toUpperCase() : '?'}">U</div>
      <div class="user-meta">
        <div class="user-name" sec:authentication="name">user</div>
        <div class="user-role">
          <span sec:authorize="hasRole('ADMIN')">Администратор</span>
          <span sec:authorize="hasRole('DIRECTOR')">Генеральный директор</span>
          <span sec:authorize="hasRole('MANAGER')">Менеджер</span>
        </div>
      </div>
      <form th:action="@{/logout}" method="post" style="margin:0">
        <button class="btn btn-ghost btn-sm btn-icon"
                title="Выйти" type="submit">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </form>
    </div>
  </div>
</aside>

<!-- ═══════════════════ TOPBAR ══════════════════════════════════════════ -->
<header th:fragment="topbar(title)" class="topbar">
  <div class="topbar-title" th:text="${title}">Раздел</div>
  <div class="topbar-actions">
    <div class="topbar-search">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" placeholder="Поиск по заявкам, клиентам..."/>
    </div>
  </div>
</header>

</body>
</html>
