<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Вход — Ветлайн ВК</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">ВК</div>
      <h1>Ветлайн ВК</h1>
      <p>Информационная система взаимодействия с клиентами</p>
    </div>

    <div th:if="${errorMsg}"   class="alert alert-error">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span th:text="${errorMsg}">Ошибка</span>
    </div>
    <div th:if="${successMsg}" class="alert alert-success">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span th:text="${successMsg}">OK</span>
    </div>

    <form th:action="@{/login}" method="post" class="login-form">
      <div class="field">
        <label for="username">Электронная почта</label>
        <input type="email" id="username" name="username" class="input"
               placeholder="manager@vetline.ru" autocomplete="email"
               required autofocus/>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" class="input"
               placeholder="••••••••••" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">
        Войти в систему
      </button>
    </form>

    <p class="login-foot">
      При проблемах со входом обратитесь к системному администратору
    </p>
  </div>
</div>
</body>
</html>
