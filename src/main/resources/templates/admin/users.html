<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Пользователи — Ветлайн ВК</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app">
  <div th:replace="~{fragments :: sidebar('admin')}"></div>
  <div th:replace="~{fragments :: topbar('Пользователи')}"></div>

  <main class="content">
    <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
    <div th:if="${error}"   class="alert alert-error"><span th:text="${error}"></span></div>

    <div class="page-head">
      <div>
        <h1>Управление пользователями</h1>
        <div class="lead">Учётные записи, роли, статусы и сброс паролей.</div>
      </div>
      <div class="page-actions">
        <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Добавить пользователя
        </a>
      </div>
    </div>

    <div class="card">
      <div class="card-body flush">
        <table class="table">
          <thead>
            <tr>
              <th>ФИО</th>
              <th>E-mail</th>
              <th>Роль</th>
              <th>Статус</th>
              <th style="text-align:right">Действия</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${users}">
              <td class="td-strong" th:text="${u.fullName}"></td>
              <td class="td-mono" th:text="${u.email}"></td>
              <td><span class="badge no-dot badge-frozen" th:text="${u.role.displayName}"></span></td>
              <td>
                <span th:if="${u.active}"  class="badge no-dot badge-done">Активен</span>
                <span th:if="${!u.active}" class="badge no-dot badge-cancelled">Деактивирован</span>
                <span th:if="${u.locked}"  class="badge no-dot badge-waiting" style="margin-left:4px">Заблокирован</span>
              </td>
              <td style="text-align:right">
                <div style="display:inline-flex;gap:6px">
                  <a th:href="@{/admin/users/{id}/edit(id=${u.id})}"
                     class="btn btn-sm">Изменить</a>
                  <form th:action="@{/admin/users/{id}/password(id=${u.id})}"
                        method="post" style="display:inline"
                        onsubmit="return confirmPwd(this)">
                    <input type="hidden" name="password" class="pwd-input"/>
                    <button class="btn btn-sm">Пароль</button>
                  </form>
                  <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}"
                        method="post" style="display:inline">
                    <input type="hidden" name="active" th:value="${!u.active}"/>
                    <button class="btn btn-sm"
                            th:text="${u.active} ? 'Деактивировать' : 'Активировать'"></button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script>
function confirmPwd(form) {
  const pwd = prompt('Введите новый пароль для пользователя:');
  if (!pwd || pwd.length < 6) { alert('Пароль должен содержать минимум 6 символов'); return false; }
  form.querySelector('.pwd-input').value = pwd;
  return true;
}
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
