<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Пользователи — Ветлайн ВК</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments :: navbar('admin')}"></div>
<div class="container">
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

  <div class="page-header">
    <h1>Управление пользователями</h1>
    <a th:href="@{/admin/users/new}" class="btn btn-primary">+ Добавить пользователя</a>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th>ФИО</th><th>E-mail</th><th>Роль</th>
          <th>Статус</th><th>Действия</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.fullName}"></td>
          <td th:text="${u.email}"></td>
          <td><span class="badge badge-new" th:text="${u.role.displayName}"></span></td>
          <td>
            <span th:if="${u.active}"  class="badge badge-done">Активен</span>
            <span th:if="${!u.active}" class="badge badge-cancelled">Деактивирован</span>
            <span th:if="${u.locked}"  class="badge badge-frozen" style="margin-left:4px">Заблокирован</span>
          </td>
          <td class="td-actions">
            <a th:href="@{/admin/users/{id}/edit(id=${u.id})}"
               class="btn btn-outline btn-sm">Изменить</a>

            <!-- Смена пароля -->
            <form th:action="@{/admin/users/{id}/password(id=${u.id})}"
                  method="post" style="display:inline"
                  onsubmit="return confirmPwd(this)">
              <input type="hidden" name="password" class="pwd-input"/>
              <button class="btn btn-outline btn-sm">Пароль</button>
            </form>

            <!-- Деактивировать / активировать -->
            <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}"
                  method="post" style="display:inline">
              <input type="hidden" name="active" th:value="${!u.active}"/>
              <button class="btn btn-outline btn-sm"
                      th:text="${u.active} ? 'Деактивировать' : 'Активировать'"></button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script>
function confirmPwd(form) {
  const pwd = prompt('Введите новый пароль для пользователя:');
  if (!pwd || pwd.length < 6) { alert('Пароль должен содержать минимум 6 символов'); return false; }
  form.querySelector('.pwd-input').value = pwd;
  return true;
}
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
